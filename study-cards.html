<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>系统架构设计师 - 闪卡学习</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --text-primary: #000000;
      --text-secondary: #666666;
      --border-color: #dddddd;
      --button-bg: #007aff;
      --button-text: #ffffff;
      --red-card: #ff6b6b;
      --yellow-card: #ffd43b;
      --green-card: #51cf66;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1c1c1e;
        --bg-secondary: #2c2c2e;
        --text-primary: #ffffff;
        --text-secondary: #adadad;
        --border-color: #3a3a3c;
        --button-bg: #0a84ff;
        --shadow: rgba(0, 0, 0, 0.3);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100vh;
      height: calc(var(--vh, 1vh) * 100);
      height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .progress-bar {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: var(--bg-secondary);
      z-index: 1000;
      flex-shrink: 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--red-card), var(--yellow-card), var(--green-card));
      transition: width 0.3s ease;
      width: 0%;
      box-shadow: 0 0 8px rgba(81, 207, 102, 0.5);
    }

    .stats-panel {
      position: sticky;
      top: 6px;
      background: var(--bg-primary);
      padding: 8px 16px;
      box-shadow: 0 2px 8px var(--shadow);
      z-index: 999;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .stats-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .stats-label {
      color: var(--text-secondary);
      font-size: 11px;
    }

    .stats-value {
      font-weight: 600;
      font-size: 16px;
    }

    .filter-panel {
      position: absolute;
      top: 56px;
      left: 0;
      right: 0;
      background: var(--bg-primary);
      padding: 12px 16px;
      box-shadow: 0 2px 8px var(--shadow);
      z-index: 998;
      display: none;
      max-height: 50vh;
      overflow-y: auto;
    }

    .filter-panel.active {
      display: block;
    }

    .filter-group {
      margin-bottom: 12px;
    }

    .filter-title {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--button-bg);
      color: var(--button-text);
      border-color: var(--button-bg);
    }

    .card-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      perspective: 1000px;
      min-height: 0; /* Allow flex shrink */
    }

    .card {
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 500px;
      position: relative;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-transition: -webkit-transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      touch-action: manipulation;
    }

    .card.flipped {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      background: var(--bg-primary);
      border-radius: 20px;
      box-shadow: 0 8px 32px var(--shadow), 0 2px 8px var(--shadow);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-front {
      z-index: 2;
      justify-content: center;
      align-items: center;
    }

    .card-back {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
      justify-content: flex-start;
      align-items: stretch;
      overflow: hidden;
      padding-top: 40px;
    }

    .card-color-indicator {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .card-chapter {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 11px;
      color: var(--text-secondary);
      text-align: right;
      max-width: 60%;
    }

    .card-content {
      font-size: 20px;
      line-height: 1.6;
      text-align: center;
      width: 100%;
    }

    .card-front .flip-hint {
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-secondary);
      opacity: 0.7;
    }

    .card-back .card-content {
      font-size: 14px;
      text-align: left;
      overflow-y: auto;
      overflow-x: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .table-wrapper {
      display: inline-block;
      min-width: 100%;
      margin: 8px 0;
      padding-bottom: 8px;
    }

    .card-back table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .card-back th,
    .card-back td {
      padding: 8px;
      border: 1px solid var(--border-color);
      text-align: left;
    }

    .card-back th {
      background: var(--bg-secondary);
      font-weight: 600;
    }

    .buttons-container {
      position: sticky;
      bottom: 0;
      background: var(--bg-primary);
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      z-index: 100;
      box-shadow: 0 -2px 8px var(--shadow);
      flex-shrink: 0;
    }

    .action-btn {
      flex: 1;
      padding: 14px 8px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 8px var(--shadow);
      color: var(--button-text);
      text-align: center;
      min-width: 0;
    }

    .btn-again {
      background: linear-gradient(135deg, #ff6b6b, #ee5a52);
    }

    .btn-hard {
      background: linear-gradient(135deg, #ffa94d, #ff922b);
    }

    .btn-good {
      background: linear-gradient(135deg, #51cf66, #40c057);
    }

    .btn-easy {
      background: linear-gradient(135deg, #339af0, #228be6);
    }

    .action-btn:active {
      transform: scale(0.93);
      box-shadow: 0 1px 4px var(--shadow);
    }

    .fab-button {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .fab-button:active {
      transform: scale(0.9);
    }

    .btn-undo {
      background: var(--bg-secondary) !important;
      color: var(--text-primary) !important;
      flex: 0 0 44px !important;
      font-size: 18px;
      border: 1px solid var(--border-color);
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }

    .empty-state-text {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .empty-state-subtext {
      font-size: 14px;
    }

    .card-fade-in {
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .stats-item {
        font-size: 11px;
      }

      .stats-value {
        font-size: 13px;
      }

      .stats-panel {
        padding: 6px 12px;
      }

      .card-content {
        font-size: 18px;
      }

      .card-face {
        padding: 24px;
      }

      .action-btn {
        padding: 12px 6px;
        font-size: 12px;
      }

      .buttons-container {
        gap: 6px;
        padding: 8px 12px;
        padding-bottom: calc(8px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="progress-bar">
    <div class="progress-bar-fill" id="progressBar"></div>
  </div>

  <div class="stats-panel">
    <div class="stats-item">
      <span class="stats-label">今日</span>
      <span class="stats-value" id="statToday">0</span>
    </div>
    <div class="stats-item">
      <span class="stats-label">待复习</span>
      <span class="stats-value" id="statDue">0</span>
    </div>
    <div class="stats-item">
      <span class="stats-label">新卡</span>
      <span class="stats-value" id="statNew">0</span>
    </div>
    <div class="stats-item">
      <span class="stats-label">已掌握</span>
      <span class="stats-value" id="statMastery">0%</span>
    </div>
    <button class="fab-button" onclick="toggleFilter()">⚙️</button>
  </div>

  <div class="filter-panel" id="filterPanel">
    <div class="filter-group">
      <div class="filter-title">颜色筛选</div>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="color" data-value="all">全部</button>
        <button class="filter-btn" data-filter="color" data-value="red">🔴 红卡</button>
        <button class="filter-btn" data-filter="color" data-value="yellow">🟡 黄卡</button>
        <button class="filter-btn" data-filter="color" data-value="green">🟢 绿卡</button>
      </div>
    </div>
    <div class="filter-group">
      <div class="filter-title">章节筛选</div>
      <div class="filter-buttons" id="chapterFilters">
        <button class="filter-btn active" data-filter="chapter" data-value="all">全部章节</button>
      </div>
    </div>
  </div>

  <div class="card-container" id="cardContainer" style="display:none;">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="card-color-indicator" id="colorIndicator"></div>
        <div class="card-chapter" id="cardChapter"></div>
        <div class="card-content" id="cardFront"></div>
        <div class="flip-hint">👆 点击翻转</div>
      </div>
      <div class="card-face card-back">
        <div class="card-color-indicator" id="colorIndicatorBack"></div>
        <div class="card-chapter" id="cardChapterBack"></div>
        <div class="card-content" id="cardBack"></div>
      </div>
    </div>
  </div>

  <div class="empty-state" id="emptyState">
    <div class="empty-state-icon">🎉</div>
    <div class="empty-state-text">今日学习完成!</div>
    <div class="empty-state-subtext">明天继续加油</div>
  </div>

  <div class="buttons-container" id="buttonsContainer" style="display:none;">
    <button class="action-btn btn-undo" onclick="undoCard()" id="undoBtn" style="display:none;">
      ↩
    </button>
    <button class="action-btn btn-again" onclick="rateCard(1)">
      忘了<br><small>1分钟</small>
    </button>
    <button class="action-btn btn-hard" onclick="rateCard(2)">
      困难<br><small>今天</small>
    </button>
    <button class="action-btn btn-good" onclick="rateCard(3)">
      良好<br><small id="goodInterval">6天</small>
    </button>
    <button class="action-btn btn-easy" onclick="rateCard(4)">
      简单<br><small id="easyInterval">10天</small>
    </button>
  </div>


  <script>
    /**
 * SM-2 间隔重复算法
 * https://www.supermemo.com/en/archives1990-2015/english/ol/sm2
 */

/**
 * 计算下次复习间隔
 * @param {number} quality - 评分 0-5 (0=完全忘记, 3=困难, 4=容易, 5=非常容易)
 * @param {number} repetitions - 连续正确次数
 * @param {number} easeFactor - 容易度因子(>=1.3)
 * @param {number} interval - 当前间隔(天)
 * @returns {{interval: number, repetitions: number, easeFactor: number}}
 */
function calculateSM2(quality, repetitions, easeFactor, interval) {
  // 输入验证
  if (quality < 0 || quality > 5) {
    throw new Error('Quality must be between 0 and 5');
  }
  if (easeFactor < 1.3) {
    easeFactor = 1.3;
  }

  let newRepetitions = repetitions;
  let newEaseFactor = easeFactor;
  let newInterval = interval;

  // 评分 < 3: 重新开始
  if (quality < 3) {
    newRepetitions = 0;
    newInterval = 1; // 1天后重新学习
  } else {
    // 评分 >= 3: 继续复习
    if (repetitions === 0) {
      newInterval = 1;
    } else if (repetitions === 1) {
      newInterval = 6;
    } else {
      newInterval = Math.round(interval * easeFactor);
    }
    newRepetitions = repetitions + 1;
  }

  // 更新容易度因子
  newEaseFactor = easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  if (newEaseFactor < 1.3) {
    newEaseFactor = 1.3;
  }

  return {
    interval: newInterval,
    repetitions: newRepetitions,
    easeFactor: parseFloat(newEaseFactor.toFixed(2))
  };
}

/**
 * 映射 Anki 风格按钮到 SM-2 评分
 * @param {number} buttonType - 1=忘了, 2=困难, 3=良好, 4=简单
 * @returns {number} SM-2 quality (0-5)
 */
function mapButtonToQuality(buttonType) {
  const mapping = {
    1: 0, // 忘了 -> 完全忘记
    2: 3, // 困难 -> 勉强记得
    3: 4, // 良好 -> 正确但费力
    4: 5  // 简单 -> 完美回忆
  };
  return mapping[buttonType] !== undefined ? mapping[buttonType] : 3;
}

/**
 * 计算下次复习时间(毫秒时间戳)
 * @param {number} intervalDays - 间隔天数
 * @returns {number} 时间戳
 */
function getNextReviewDate(intervalDays) {
  const now = Date.now();
  return now + intervalDays * 24 * 60 * 60 * 1000;
}

/**
 * 判断是否到期需要复习
 * @param {number} nextReview - 下次复习时间戳
 * @returns {boolean}
 */
function isDue(nextReview) {
  return Date.now() >= nextReview;
}

// 浏览器全局变量

if (typeof window !== 'undefined') {
  window.SM2 = {
    calculateSM2,
    mapButtonToQuality,
    getNextReviewDate,
    isDue
  };
}
  </script>

  <script>
    /**
 * 卡片队列管理
 * 负责筛选、排序、状态追踪
 */

/**
 * 卡片状态
 */
const CardState = {
  NEW: 'new',           // 新卡
  LEARNING: 'learning', // 学习中
  REVIEW: 'review',     // 复习
  MATURE: 'mature'      // 已掌握 (interval >= 21天)
};

/**
 * 初始化卡片状态
 * @param {Object} card - 卡片数据
 * @returns {Object} 带状态的卡片
 */
function initCardState(card) {
  return {
    ...card,
    id: card.id || generateId(card),
    state: CardState.NEW,
    repetitions: 0,
    easeFactor: 2.5,
    interval: 0,
    nextReview: Date.now(), // 新卡立即可学
    lastReview: null,
    reviewCount: 0
  };
}

/**
 * 生成卡片ID
 */
function generateId(card) {
  return `${card.chapter}-${card.front.substring(0, 20)}`.replace(/[^a-zA-Z0-9-]/g, '');
}

/**
 * 筛选卡片
 * @param {Array} cards - 卡片列表
 * @param {Object} filters - {colors: ['red'], chapters: ['1. xxx']}
 * @returns {Array} 筛选后的卡片
 */
function filterCards(cards, filters) {
  let result = cards;

  if (filters.colors && filters.colors.length > 0) {
    result = result.filter(card => filters.colors.includes(card.color));
  }

  if (filters.chapters && filters.chapters.length > 0) {
    result = result.filter(card => filters.chapters.includes(card.chapter));
  }

  return result;
}

/**
 * 获取到期卡片
 * @param {Array} cards - 卡片列表
 * @returns {Array} 到期卡片
 */
function getDueCards(cards) {
  const now = Date.now();
  return cards.filter(card => card.nextReview <= now);
}

/**
 * 获取新卡
 * @param {Array} cards - 卡片列表
 * @param {number} limit - 限制数量
 * @returns {Array} 新卡
 */
function getNewCards(cards, limit = 30) {
  return cards
    .filter(card => card.state === CardState.NEW)
    .slice(0, limit);
}

/**
 * 构建学习队列
 * @param {Array} cards - 所有卡片
 * @param {number} newCardLimit - 每日新卡限制
 * @returns {Array} 今日学习队列
 */
function buildQueue(cards, newCardLimit = 30) {
  const dueCards = getDueCards(cards).filter(card => card.state !== CardState.NEW);
  const newCards = getNewCards(cards, newCardLimit);

  // 排序: 到期时间越早越靠前
  dueCards.sort((a, b) => a.nextReview - b.nextReview);

  return [...dueCards, ...newCards];
}

/**
 * 更新卡片状态
 * @param {Object} card - 卡片
 * @param {Object} sm2Result - SM-2算法结果 {interval, repetitions, easeFactor}
 * @param {number} nextReview - 下次复习时间戳
 * @returns {Object} 更新后的卡片
 */
function updateCardState(card, sm2Result, nextReview) {
  const newCard = {
    ...card,
    repetitions: sm2Result.repetitions,
    easeFactor: sm2Result.easeFactor,
    interval: sm2Result.interval,
    nextReview: nextReview,
    lastReview: Date.now(),
    reviewCount: card.reviewCount + 1
  };

  // 更新状态
  if (sm2Result.repetitions === 0) {
    newCard.state = CardState.LEARNING;
  } else if (sm2Result.interval >= 21) {
    newCard.state = CardState.MATURE;
  } else {
    newCard.state = CardState.REVIEW;
  }

  return newCard;
}

/**
 * 统计数据
 * @param {Array} cards - 卡片列表
 * @returns {Object} 统计结果
 */
function getStats(cards) {
  const total = cards.length;
  const byState = {
    new: cards.filter(c => c.state === CardState.NEW).length,
    learning: cards.filter(c => c.state === CardState.LEARNING).length,
    review: cards.filter(c => c.state === CardState.REVIEW).length,
    mature: cards.filter(c => c.state === CardState.MATURE).length
  };
  const due = getDueCards(cards).length;
  const reviewedToday = cards.filter(c => {
    if (!c.lastReview) return false;
    const today = new Date().setHours(0, 0, 0, 0);
    return c.lastReview >= today;
  }).length;

  return {
    total,
    byState,
    due,
    reviewedToday,
    masteryRate: total > 0 ? ((byState.mature / total) * 100).toFixed(1) : 0
  };
}

/**
 * 获取所有章节列表
 * @param {Array} cards - 卡片列表
 * @returns {Array} 章节列表
 */
function getChapters(cards) {
  const chapters = new Set();
  cards.forEach(card => chapters.add(card.chapter));
  return Array.from(chapters).sort();
}

// 浏览器全局变量

if (typeof window !== 'undefined') {
  window.CardQueue = {
    CardState,
    initCardState,
    generateId,
    filterCards,
    getDueCards,
    getNewCards,
    buildQueue,
    updateCardState,
    getStats,
    getChapters
  };
}
  </script>

  <script>
    /**
 * 触摸滑动手势处理
 * 支持左滑/右滑检测
 */

/**
 * 滑动方向
 */
const SwipeDirection = {
  LEFT: 'left',
  RIGHT: 'right',
  NONE: 'none'
};

/**
 * 检测滑动方向
 * @param {number} startX - 起始 X 坐标
 * @param {number} endX - 结束 X 坐标
 * @param {number} startY - 起始 Y 坐标
 * @param {number} endY - 结束 Y 坐标
 * @param {number} threshold - 最小滑动距离阈值(px)
 * @returns {string} 滑动方向 'left'|'right'|'none'
 */
function detectSwipe(startX, endX, startY, endY, threshold = 50) {
  const deltaX = endX - startX;
  const deltaY = endY - startY;

  // 横向移动距离必须大于竖向移动距离（判断为横向滑动）
  if (Math.abs(deltaX) < Math.abs(deltaY)) {
    return SwipeDirection.NONE;
  }

  // 横向移动距离必须超过阈值
  if (Math.abs(deltaX) < threshold) {
    return SwipeDirection.NONE;
  }

  return deltaX < 0 ? SwipeDirection.LEFT : SwipeDirection.RIGHT;
}

/**
 * 创建滑动手势处理器
 * @param {HTMLElement} element - 绑定的 DOM 元素
 * @param {Object} callbacks - {onSwipeLeft: fn, onSwipeRight: fn}
 * @param {number} threshold - 滑动阈值(px)
 * @returns {Function} 清理函数
 */
function createSwipeHandler(element, callbacks, threshold = 50) {
  if (!element) {
    throw new Error('Element is required');
  }

  let startX = 0;
  let startY = 0;

  const handleTouchStart = (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  };

  const handleTouchEnd = (e) => {
    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;

    const direction = detectSwipe(startX, endX, startY, endY, threshold);

    if (direction === SwipeDirection.LEFT && callbacks.onSwipeLeft) {
      callbacks.onSwipeLeft(e);
    } else if (direction === SwipeDirection.RIGHT && callbacks.onSwipeRight) {
      callbacks.onSwipeRight(e);
    }
  };

  element.addEventListener('touchstart', handleTouchStart, { passive: true });
  element.addEventListener('touchend', handleTouchEnd, { passive: true });

  // 返回清理函数
  return () => {
    element.removeEventListener('touchstart', handleTouchStart);
    element.removeEventListener('touchend', handleTouchEnd);
  };
}

// 浏览器全局变量

if (typeof window !== 'undefined') {
  window.Swipe = {
    SwipeDirection,
    detectSwipe,
    createSwipeHandler
  };
}

  <script>
    // 应用逻辑
    const STORAGE_KEY = 'study-cards-state';
    let allCards = [];
    let currentQueue = [];
    let currentCardIndex = 0;
    let currentFilters = { colors: [], chapters: [] };
    let swipeCleanup = null;

    // 初始化
    function init() {
      // 加载卡片数据
      allCards = CARDS_DATA.map(card => {
        const stored = getStoredCardState(card);
        return stored ? stored : CardQueue.initCardState(card);
      });

      // 构建章节筛选按钮
      const chapters = CardQueue.getChapters(allCards);
      const chapterFilters = document.getElementById('chapterFilters');
      chapters.forEach(chapter => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.setAttribute('data-filter', 'chapter');
        btn.setAttribute('data-value', chapter);
        btn.textContent = chapter.length > 20 ? chapter.substring(0, 20) + '...' : chapter;
        btn.onclick = handleFilterClick;
        chapterFilters.appendChild(btn);
      });

      // 绑定筛选按钮事件
      document.querySelectorAll('.filter-btn[data-filter="color"]').forEach(btn => {
        btn.onclick = handleFilterClick;
      });

      // 绑定卡片点击事件
      document.getElementById('card').onclick = flipCard;

      // 绑定滑动手势
      if (typeof Swipe !== 'undefined') {
        swipeCleanup = Swipe.createSwipeHandler(
          document.getElementById('card'),
          {
            onSwipeLeft: () => rateCard(1),  // 左滑 = 忘了
            onSwipeRight: () => rateCard(3)  // 右滑 = 记住
          },
          80
        );
      }

      // 更新队列和UI
      updateQueue();
      updateStats();
      showNextCard();
    }

    // 获取存储的卡片状态
    function getStoredCardState(card) {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (!stored) return null;

      try {
        const data = JSON.parse(stored);
        const id = CardQueue.generateId ? CardQueue.generateId(card) : (card.chapter + '-' + card.front.substring(0, 20)).replace(/[^a-zA-Z0-9-]/g, '');
        const storedCard = data[id];

        // 验证数据结构并设置默认值
        if (!storedCard || typeof storedCard !== 'object') return null;
        if (typeof storedCard.state !== 'string') return null;
        if (typeof storedCard.repetitions !== 'number') return null;
        if (typeof storedCard.easeFactor !== 'number') return null;

        // 为旧数据添加缺失字段
        if (storedCard.reviewCount === undefined) storedCard.reviewCount = 0;

        return storedCard;
      } catch (e) {
        console.warn('Failed to parse stored state:', e);
        return null;
      }
    }

    // 保存卡片状态
    function saveCardState(card) {
      let data = {};
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) data = JSON.parse(stored);
        data[card.id] = card;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        if (e.name === 'QuotaExceededError') {
          console.warn('localStorage quota exceeded, clearing old data');
          try {
            // 只保留当前卡片
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ [card.id]: card }));
          } catch (retryError) {
            console.error('Failed to save even after clearing:', retryError);
          }
        } else {
          console.error('Failed to save card state:', e);
        }
      }
    }

    // 更新队列
    function updateQueue() {
      let filtered = allCards;

      // 应用颜色筛选
      if (currentFilters.colors.length > 0 && !currentFilters.colors.includes('all')) {
        filtered = filtered.filter(card => currentFilters.colors.includes(card.color));
      }

      // 应用章节筛选
      if (currentFilters.chapters.length > 0 && !currentFilters.chapters.includes('all')) {
        filtered = filtered.filter(card => currentFilters.chapters.includes(card.chapter));
      }

      currentQueue = CardQueue.buildQueue(filtered, 20);
      currentCardIndex = 0;
    }

    // 更新统计
    function updateStats() {
      const stats = CardQueue.getStats(allCards);
      document.getElementById('statToday').textContent = stats.reviewedToday;
      document.getElementById('statDue').textContent = stats.due;
      document.getElementById('statNew').textContent = stats.byState.new;
      document.getElementById('statMastery').textContent = stats.masteryRate + '%';

      // 更新进度条
      const progress = currentQueue.length > 0
        ? ((currentCardIndex / currentQueue.length) * 100)
        : 0;
      document.getElementById('progressBar').style.width = progress + '%';
    }

    // 显示下一张卡片
    function showNextCard() {
      if (currentCardIndex >= currentQueue.length) {
        showEmptyState();
        return;
      }

      const card = currentQueue[currentCardIndex];

      // 更新卡片内容
      document.getElementById('cardFront').textContent = card.front;
      document.getElementById('cardBack').innerHTML = formatBack(card.back);
      document.getElementById('cardChapter').textContent = card.chapter;
      document.getElementById('cardChapterBack').textContent = card.chapter;

      // 更新颜色指示器
      const color = card.color === 'red' ? '#ff6b6b' : card.color === 'yellow' ? '#ffd43b' : '#51cf66';
      document.getElementById('colorIndicator').style.background = color;
      document.getElementById('colorIndicatorBack').style.background = color;

      // 更新间隔预览
      updateIntervalPreview(card);

      // 显示UI
      const cardContainer = document.getElementById('cardContainer');
      const buttonsContainer = document.getElementById('buttonsContainer');
      cardContainer.style.display = 'flex';
      buttonsContainer.style.display = 'flex';
      document.getElementById('emptyState').style.display = 'none';

      // 重置翻转状态
      const cardElement = document.getElementById('card');
      cardElement.classList.remove('flipped');

      // 添加淡入动画
      cardElement.classList.remove('card-fade-in');
      setTimeout(() => cardElement.classList.add('card-fade-in'), 10);
    }

    // 格式化背面内容
    function formatBack(text) {
      // HTML转义函数防止XSS
      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // Handle markdown bold (先转义再添加允许的HTML)
      function processBold(str) {
        return escapeHtml(str).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      }

      // 检测是否是表格
      if (text.includes('|') && text.split('\n').length > 2) {
        const lines = text.split('\n').filter(l => l.trim());
        let html = '<div class="table-wrapper"><table>';
        lines.forEach((line, i) => {
          if (line.match(/^[\s\-|:]+$/)) return; // 跳过分隔行

          const cells = line.split('|').filter(c => c.trim()).map(c => processBold(c.trim()));
          const tag = i === 0 ? 'th' : 'td';
          html += '<tr>' + cells.map(c => `<${tag}>${c}</${tag}>`).join('') + '</tr>';
        });
        html += '</table></div>';
        return html;
      }

      // 处理列表
      let result = text;
      result = result.replace(/^- (.+)$/gm, (match, p1) => '<li>' + escapeHtml(p1) + '</li>');
      if (result.includes('<li>')) {
        result = result.replace(/((?:<li>.+<\/li>\n?)+)/g, '<ul>$1</ul>');
      }
      result = processBold(result);
      result = result.replace(/\n/g, '<br>');
      return result;
    }

    // 更新间隔预览
    function updateIntervalPreview(card) {
      if (card.state === 'new' || card.state === 'learning') {
        const step = card.learningStep || 0;
        const nextStep = step + 1;
        if (nextStep >= LEARNING_STEPS.length) {
          document.getElementById('goodInterval').textContent = '1天';
        } else {
          document.getElementById('goodInterval').textContent = LEARNING_STEPS[nextStep] + '分钟';
        }
        document.getElementById('easyInterval').textContent = '4天';
      } else {
        const goodResult = SM2.calculateSM2(SM2.mapButtonToQuality(3), card.repetitions, card.easeFactor, card.interval);
        const easyResult = SM2.calculateSM2(SM2.mapButtonToQuality(4), card.repetitions, card.easeFactor, card.interval);
        document.getElementById('goodInterval').textContent = goodResult.interval + '天';
        document.getElementById('easyInterval').textContent = easyResult.interval + '天';
      }
    }

    // 翻转卡片
    function flipCard() {
      document.getElementById('card').classList.toggle('flipped');
    }

    // 撤销上一张
    let lastCardState = null;

    function undoCard() {
      if (!lastCardState) return;
      // 恢复上一张卡片状态
      const cardIndex = allCards.findIndex(c => c.id === lastCardState.id);
      if (cardIndex !== -1) {
        allCards[cardIndex] = lastCardState;
        saveCardState(lastCardState);
      }
      // 回退索引
      if (currentCardIndex > 0) currentCardIndex--;
      lastCardState = null;
      document.getElementById('undoBtn').style.display = 'none';
      updateStats();
      showNextCard();
    }

    // 评分卡片 - 支持 Anki 学习步骤
    // 学习步骤: 1分钟 → 10分钟 → 毕业
    const LEARNING_STEPS = [1, 10]; // 分钟

    function rateCard(buttonType) {
      if (currentCardIndex >= currentQueue.length) return; // 防止索引越界
      const card = currentQueue[currentCardIndex];
      // 保存当前状态用于撤销(深拷贝)
      lastCardState = JSON.parse(JSON.stringify(card));
      document.getElementById('undoBtn').style.display = 'flex';

      let updatedCard;

      // 学习中的卡片（新卡或失败卡）
      if (card.state === 'new' || card.state === 'learning') {
        const step = card.learningStep || 0;

        if (buttonType === 1) {
          // 忘了 → 回到第一步
          updatedCard = {
            ...card,
            state: 'learning',
            learningStep: 0,
            nextReview: Date.now() + LEARNING_STEPS[0] * 60 * 1000,
            lastReview: Date.now(),
            reviewCount: card.reviewCount + 1
          };
        } else if (buttonType === 4) {
          // 简单 → 直接毕业，跳过所有步骤
          const sm2Result = SM2.calculateSM2(5, 1, card.easeFactor, 1);
          updatedCard = {
            ...card,
            state: sm2Result.interval >= 21 ? 'mature' : 'review',
            learningStep: null,
            interval: sm2Result.interval,
            repetitions: sm2Result.repetitions,
            easeFactor: sm2Result.easeFactor,
            nextReview: SM2.getNextReviewDate(sm2Result.interval),
            lastReview: Date.now(),
            reviewCount: card.reviewCount + 1
          };
        } else {
          // 困难/良好 → 进入下一步
          const nextStep = step + 1;
          if (nextStep >= LEARNING_STEPS.length) {
            // 毕业！进入复习队列
            const quality = SM2.mapButtonToQuality(buttonType);
            const sm2Result = SM2.calculateSM2(quality, 0, card.easeFactor, 0);
            updatedCard = {
              ...card,
              state: 'review',
              learningStep: null,
              interval: sm2Result.interval,
              repetitions: sm2Result.repetitions,
              easeFactor: sm2Result.easeFactor,
              nextReview: SM2.getNextReviewDate(sm2Result.interval),
              lastReview: Date.now(),
              reviewCount: card.reviewCount + 1
            };
          } else {
            // 进入下一个学习步骤
            updatedCard = {
              ...card,
              state: 'learning',
              learningStep: nextStep,
              nextReview: Date.now() + LEARNING_STEPS[nextStep] * 60 * 1000,
              lastReview: Date.now(),
              reviewCount: card.reviewCount + 1
            };
          }
        }
      } else {
        // 复习中的卡片 - 标准 SM-2 流程
        const quality = SM2.mapButtonToQuality(buttonType);
        const sm2Result = SM2.calculateSM2(quality, card.repetitions, card.easeFactor, card.interval);
        const nextReview = SM2.getNextReviewDate(sm2Result.interval);
        updatedCard = CardQueue.updateCardState(card, sm2Result, nextReview);

        // 如果失败，进入学习步骤
        if (buttonType === 1) {
          updatedCard.state = 'learning';
          updatedCard.learningStep = 0;
          updatedCard.nextReview = Date.now() + LEARNING_STEPS[0] * 60 * 1000;
        }
      }

      // 更新 allCards
      const cardIndex = allCards.findIndex(c => c.id === card.id);
      if (cardIndex !== -1) {
        allCards[cardIndex] = updatedCard;
      }

      // 保存状态
      saveCardState(updatedCard);

      // 下一张
      currentCardIndex++;
      updateStats();
      showNextCard();
    }

    // 显示空状态
    function showEmptyState() {
      document.getElementById('cardContainer').style.display = 'none';
      document.getElementById('buttonsContainer').style.display = 'none';
      document.getElementById('emptyState').style.display = 'flex';
    }

    // 切换筛选面板
    function toggleFilter() {
      document.getElementById('filterPanel').classList.toggle('active');
    }

    // 处理筛选点击
    function handleFilterClick(e) {
      const btn = e.target;
      const filterType = btn.getAttribute('data-filter');
      const filterValue = btn.getAttribute('data-value');

      // 更新按钮状态
      const group = btn.parentElement;
      group.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      // 更新筛选器
      if (filterType === 'color') {
        currentFilters.colors = filterValue === 'all' ? [] : [filterValue];
      } else if (filterType === 'chapter') {
        currentFilters.chapters = filterValue === 'all' ? [] : [filterValue];
      }

      // 重新构建队列
      updateQueue();
      updateStats();
      showNextCard();
    }

    // 清理事件监听器
    window.addEventListener('beforeunload', () => {
      if (swipeCleanup) swipeCleanup();
    });

    // 启动应用
    init();
  </script>
</body>
</html>
