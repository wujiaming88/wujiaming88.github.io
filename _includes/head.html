<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  {%- seo -%}

  <!-- Open Graph / Twitter Card 富分享预览 -->
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 200 | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:type" content="{% if page.layout == 'single' %}article{% else %}website{% endif %}">
  {% if page.header.overlay_image %}
  <meta property="og:image" content="{{ page.header.overlay_image }}">
  <meta name="twitter:image" content="{{ page.header.overlay_image }}">
  {% endif %}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
  <meta name="twitter:description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 200 | escape }}">

  <!-- 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- 样式 -->
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/post.css" | relative_url }}">
  {% if page.url == '/' %}<link rel="stylesheet" href="{{ "/assets/home.css" | relative_url }}">{% endif %}

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/logo/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/logo/favicon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/logo/favicon-180.png' | relative_url }}">
  <meta name="msapplication-TileImage" content="{{ '/assets/images/logo/favicon-192.png' | relative_url }}">
  {% unless page.header.overlay_image %}
  <meta property="og:image" content="{{ '/assets/images/logo/logo-og.png' | absolute_url }}">
  <meta name="twitter:image" content="{{ '/assets/images/logo/logo-og.png' | absolute_url }}">
  {% endunless %}

  {%- feed_meta -%}

  <!-- 主题防闪烁：在渲染前设置主题 -->
  <script>
  (function() {
    var saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
  </script>

  <!-- Mermaid 图表渲染（页面有 mermaid 代码块时启用） -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs';
    document.addEventListener('DOMContentLoaded', function () {
      // 把 Prism/kramdown 生成的 ```mermaid 代码块转成 mermaid 容器
      var blocks = document.querySelectorAll('pre code.language-mermaid, pre > code.language-mermaid');
      if (!blocks.length) return;
      blocks.forEach(function (code) {
        var pre = code.closest('pre');
        var div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code.textContent;
        if (pre && pre.parentNode) pre.parentNode.replaceChild(div, pre);
      });
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? 'dark' : 'default',
        securityLevel: 'loose',
        flowchart: { htmlLabels: true, curve: 'basis' }
      });
      mermaid.run({ querySelector: '.mermaid' });
    });
  </script>
  <style>
    .mermaid { background: transparent; text-align: center; margin: 1.5em 0; overflow-x: auto; }
    .mermaid svg { max-width: 100%; height: auto; }
  </style>

  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
