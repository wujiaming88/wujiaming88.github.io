<!-- Pagefind 搜索 Modal -->
<div class="search-modal" id="searchModal">
  <div class="search-modal-overlay" onclick="closeSearchModal()"></div>
  <div class="search-modal-container">
    <div class="search-modal-header">
      <span class="search-modal-icon">🔍</span>
      <input
        type="text"
        id="searchModalInput"
        class="search-modal-input"
        placeholder="搜索文章标题和内容..."
        autocomplete="off"
        autofocus
      >
      <button class="search-modal-close" onclick="closeSearchModal()" aria-label="关闭搜索">✕</button>
    </div>

    <div class="search-modal-results" id="searchModalResults">
      <div class="search-modal-hint">
        <div class="search-hint-main">💡 输入关键词搜索文章</div>
        <div class="search-hint-sub">支持中文分词，搜索标题、内容、标签</div>
      </div>
    </div>

    <div class="search-modal-footer">
      <span class="search-modal-tip">⌘K 打开搜索</span>
      <span class="search-modal-tip">ESC 关闭</span>
      <span class="search-modal-tip">↑↓ 导航</span>
      <span class="search-modal-tip">Enter 选择</span>
    </div>
  </div>
</div>

<style>
/* ============================================
   搜索 Modal 样式
   ============================================ */

.search-modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 9999;
  animation: fadeIn 0.2s ease;
}

.search-modal.active {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 10vh;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.search-modal-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
}

.search-modal-container {
  position: relative;
  width: 90%;
  max-width: 640px;
  background: var(--bg-card);
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  display: flex;
  flex-direction: column;
  max-height: 70vh;
  animation: slideDown 0.25s ease;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.search-modal-header {
  display: flex;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-color);
  gap: 12px;
}

.search-modal-icon {
  font-size: 1.2rem;
  opacity: 0.6;
  flex-shrink: 0;
}

.search-modal-input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 1.1rem;
  color: var(--text-primary);
  outline: none;
  font-family: var(--font-sans);
}

.search-modal-input::placeholder {
  color: var(--text-tertiary);
}

.search-modal-close {
  width: 32px;
  height: 32px;
  border: none;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border-radius: 6px;
  cursor: pointer;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  flex-shrink: 0;
}

.search-modal-close:hover {
  background: var(--accent);
  color: #fff;
}

.search-modal-results {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  min-height: 200px;
  max-height: calc(70vh - 140px);
}

/* 搜索提示 */
.search-modal-hint {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem 2rem;
  text-align: center;
}

.search-hint-main {
  font-size: 1rem;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.search-hint-sub {
  font-size: 0.85rem;
  color: var(--text-tertiary);
}

/* Loading 状态 */
.search-modal-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem 2rem;
  color: var(--text-secondary);
}

.search-loading-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--border-color);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 12px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.search-loading-text {
  font-size: 0.9rem;
}

/* 搜索结果项 */
.search-result-item {
  display: block;
  padding: 14px 16px;
  border-radius: 8px;
  text-decoration: none;
  color: inherit;
  transition: all 0.2s ease;
  cursor: pointer;
  margin-bottom: 4px;
  border: 2px solid transparent;
}

.search-result-item:hover {
  background: var(--bg-tertiary);
}

.search-result-item.highlighted {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  transform: scale(1.01);
}

.search-result-item.highlighted .search-result-title {
  color: #fff;
}

.search-result-item.highlighted .search-result-meta,
.search-result-item.highlighted .search-result-excerpt {
  color: rgba(255, 255, 255, 0.85);
}

.search-result-title {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-heading);
  margin-bottom: 6px;
  line-height: 1.4;
}

.search-result-meta {
  font-size: 0.78rem;
  color: var(--text-tertiary);
  margin-bottom: 6px;
}

.search-result-excerpt {
  font-size: 0.85rem;
  color: var(--text-secondary);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.search-result-excerpt mark {
  background: rgba(99, 102, 241, 0.2);
  color: var(--accent);
  padding: 0 2px;
  border-radius: 2px;
  font-weight: 600;
}

/* 空状态 */
.search-modal-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem 2rem;
  text-align: center;
}

.search-empty-icon {
  font-size: 2.5rem;
  margin-bottom: 12px;
  opacity: 0.5;
}

.search-empty-text {
  font-size: 1rem;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.search-empty-hint {
  font-size: 0.85rem;
  color: var(--text-tertiary);
}

/* Footer */
.search-modal-footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 12px 20px;
  border-top: 1px solid var(--border-color);
  background: var(--bg-tertiary);
  border-radius: 0 0 12px 12px;
}

.search-modal-tip {
  font-size: 0.75rem;
  color: var(--text-tertiary);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* 移动端适配 */
@media (max-width: 768px) {
  .search-modal.active {
    padding-top: 5vh;
  }

  .search-modal-container {
    width: 95%;
    max-height: 80vh;
  }

  .search-modal-header {
    padding: 12px 16px;
  }

  .search-modal-input {
    font-size: 1rem;
  }

  .search-modal-results {
    max-height: calc(80vh - 120px);
  }

  .search-modal-footer {
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 16px;
  }

  .search-modal-tip {
    font-size: 0.7rem;
  }
}
</style>

<script>
(function() {
  'use strict';

  let pagefind = null;
  let searchInput = null;
  let searchResults = null;
  let searchModal = null;
  let currentResults = [];
  let highlightedIndex = -1;
  let debounceTimer = null;

  // 初始化 Pagefind
  async function initPagefind() {
    if (pagefind) return;

    try {
      pagefind = await import('/pagefind/pagefind.js');
      await pagefind.options({
        excerptLength: 15,
        highlightParam: 'highlight'
      });
      console.log('Pagefind initialized');
    } catch (e) {
      console.error('Failed to load Pagefind:', e);
    }
  }

  // 打开搜索 Modal
  function openSearchModal() {
    if (!searchModal) return;
    searchModal.classList.add('active');
    document.body.style.overflow = 'hidden';

    if (searchInput) {
      searchInput.focus();
      searchInput.select();
    }

    // 延迟加载 Pagefind（首次打开时）
    if (!pagefind) {
      initPagefind();
    }
  }

  // 关闭搜索 Modal
  function closeSearchModal() {
    if (!searchModal) return;
    searchModal.classList.remove('active');
    document.body.style.overflow = '';

    if (searchInput) {
      searchInput.value = '';
    }

    showHint();
    currentResults = [];
    highlightedIndex = -1;
  }

  // 显示提示
  function showHint() {
    if (!searchResults) return;
    searchResults.innerHTML = `
      <div class="search-modal-hint">
        <div class="search-hint-main">💡 输入关键词搜索文章</div>
        <div class="search-hint-sub">支持中文分词，搜索标题、内容、标签</div>
      </div>
    `;
  }

  // 显示 Loading
  function showLoading() {
    if (!searchResults) return;
    searchResults.innerHTML = `
      <div class="search-modal-loading">
        <div class="search-loading-spinner"></div>
        <div class="search-loading-text">搜索中...</div>
      </div>
    `;
  }

  // 显示空状态
  function showEmpty(query) {
    if (!searchResults) return;
    searchResults.innerHTML = `
      <div class="search-modal-empty">
        <div class="search-empty-icon">🔍</div>
        <div class="search-empty-text">未找到"${escapeHtml(query)}"相关的文章</div>
        <div class="search-empty-hint">试试其他关键词</div>
      </div>
    `;
  }

  // 执行搜索
  async function performSearch(query) {
    if (!query || !query.trim()) {
      showHint();
      currentResults = [];
      highlightedIndex = -1;
      return;
    }

    query = query.trim();

    if (!pagefind) {
      showLoading();
      await initPagefind();
    }

    if (!pagefind) {
      searchResults.innerHTML = `
        <div class="search-modal-empty">
          <div class="search-empty-icon">⚠️</div>
          <div class="search-empty-text">搜索功能加载失败</div>
          <div class="search-empty-hint">请刷新页面重试</div>
        </div>
      `;
      return;
    }

    showLoading();

    try {
      const search = await pagefind.search(query);

      if (!search || !search.results || search.results.length === 0) {
        showEmpty(query);
        currentResults = [];
        highlightedIndex = -1;
        return;
      }

      // 获取前 10 条结果的详细数据
      const results = await Promise.all(
        search.results.slice(0, 10).map(r => r.data())
      );

      currentResults = results;
      highlightedIndex = -1;
      renderResults(results);

    } catch (e) {
      console.error('Search error:', e);
      searchResults.innerHTML = `
        <div class="search-modal-empty">
          <div class="search-empty-icon">⚠️</div>
          <div class="search-empty-text">搜索出错</div>
          <div class="search-empty-hint">${escapeHtml(e.message)}</div>
        </div>
      `;
    }
  }

  // 渲染搜索结果
  function renderResults(results) {
    if (!searchResults) return;

    let html = '';
    results.forEach((result, index) => {
      const title = result.meta?.title || result.url?.split('/').pop() || '无标题';
      const date = result.meta?.date || '';
      const category = result.meta?.category || '';
      const excerpt = result.excerpt || '';
      const url = result.url || '#';

      html += `
        <a href="${url}" class="search-result-item${index === 0 ? ' highlighted' : ''}" data-index="${index}">
          <div class="search-result-title">${title}</div>
          ${date || category ? `<div class="search-result-meta">${date}${date && category ? ' · ' : ''}${category}</div>` : ''}
          ${excerpt ? `<div class="search-result-excerpt">${excerpt}</div>` : ''}
        </a>
      `;
    });

    searchResults.innerHTML = html;
    highlightedIndex = 0; // 自动高亮第一条

    // 绑定点击事件
    searchResults.querySelectorAll('.search-result-item').forEach(item => {
      item.addEventListener('click', (e) => {
        closeSearchModal();
      });
    });
  }

  // 更新高亮
  function updateHighlight() {
    const items = searchResults.querySelectorAll('.search-result-item');
    items.forEach((item, index) => {
      if (index === highlightedIndex) {
        item.classList.add('highlighted');
        item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      } else {
        item.classList.remove('highlighted');
      }
    });
  }

  // HTML 转义
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // 键盘导航
  function handleKeyDown(e) {
    if (!searchModal.classList.contains('active')) return;

    const items = searchResults.querySelectorAll('.search-result-item');

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (items.length === 0) return;
      highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1);
      updateHighlight();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (items.length === 0) return;
      highlightedIndex = Math.max(highlightedIndex - 1, -1);
      updateHighlight();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (highlightedIndex >= 0 && items[highlightedIndex]) {
        window.location.href = items[highlightedIndex].href;
      } else if (items.length > 0) {
        window.location.href = items[0].href;
      }
    } else if (e.key === 'Escape') {
      e.preventDefault();
      closeSearchModal();
    }
  }

  // ⌘K / Ctrl+K 快捷键
  function handleGlobalKeyDown(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      if (searchModal.classList.contains('active')) {
        closeSearchModal();
      } else {
        openSearchModal();
      }
    }
  }

  // DOM 加载完成后初始化
  document.addEventListener('DOMContentLoaded', function() {
    searchModal = document.getElementById('searchModal');
    searchInput = document.getElementById('searchModalInput');
    searchResults = document.getElementById('searchModalResults');

    if (!searchModal || !searchInput || !searchResults) {
      console.error('Search modal elements not found');
      return;
    }

    // 搜索输入事件（防抖）
    searchInput.addEventListener('input', function(e) {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        performSearch(e.target.value);
      }, 300);
    });

    // 键盘导航
    searchInput.addEventListener('keydown', handleKeyDown);

    // 全局快捷键
    document.addEventListener('keydown', handleGlobalKeyDown);

    // 导出全局函数供外部调用
    window.openSearchModal = openSearchModal;
    window.closeSearchModal = closeSearchModal;

    console.log('Search modal initialized');
  });
})();
</script>
