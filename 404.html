---
permalink: /404.html
layout: default
---

<div class="error-page">
  <div class="error-code">404</div>
  <h2 class="error-title">页面走丢了</h2>
  <p class="error-desc">抱歉，您访问的页面不存在或已被移动。不妨从下面继续探索 👇</p>

  <div class="error-actions">
    <a href="{{ '/' | relative_url }}" class="error-btn error-btn--primary">🏠 返回首页</a>
    <a href="{{ '/articles/' | relative_url }}" class="error-btn">📚 全部文章</a>
    <button type="button" class="error-btn" onclick="if(window.openSearchModal){openSearchModal()}else{location.href='{{ '/' | relative_url }}'}">🔍 搜索文章</button>
  </div>

  <div class="error-recent">
    <h3 class="error-recent-title">看看最新文章</h3>
    <ul class="error-recent-list">
      {% for post in site.posts limit:6 %}
      <li>
        <a href="{{ post.url | relative_url }}">
          <span class="error-recent-name">{{ post.title }}</span>
          <span class="error-recent-date">{{ post.date | date: '%Y.%m.%d' }}</span>
        </a>
      </li>
      {% endfor %}
    </ul>
  </div>
</div>

<style>
.error-page {
  text-align: center;
  padding: 3.5rem 1.5rem 4rem;
  max-width: 720px;
  margin: 0 auto;
}
.error-code {
  font-family: 'Space Grotesk', var(--font-sans);
  font-size: clamp(5rem, 18vw, 9rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.04em;
  background: linear-gradient(135deg, var(--accent), var(--accent-light), var(--accent-cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.5rem;
}
.error-title {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--text-heading);
  margin: 0 0 0.75rem;
}
.error-desc {
  color: var(--text-secondary);
  font-size: 1rem;
  margin: 0 auto 2rem;
  max-width: 460px;
  line-height: 1.7;
}
.error-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  justify-content: center;
  margin-bottom: 3rem;
}
.error-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.65rem 1.4rem;
  border-radius: var(--radius-lg, 12px);
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 0.9rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s ease;
}
.error-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-2px);
}
.error-btn--primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(99,102,241,0.25);
}
.error-btn--primary:hover {
  color: #fff;
  box-shadow: 0 6px 20px rgba(99,102,241,0.35);
}
.error-recent {
  text-align: left;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg, 16px);
  padding: 1.5rem 1.75rem;
  box-shadow: var(--shadow-sm);
}
.error-recent-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-heading);
  margin: 0 0 1rem;
  padding-bottom: 0.75rem;
  border-bottom: 2px solid var(--border-color);
}
.error-recent-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.error-recent-list li { margin: 0; }
.error-recent-list a {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.7rem 0.25rem;
  border-bottom: 1px solid var(--border-light, var(--border-color));
  text-decoration: none;
  color: var(--text-primary);
  transition: all 0.2s ease;
}
.error-recent-list li:last-child a { border-bottom: none; }
.error-recent-list a:hover {
  color: var(--accent);
  padding-left: 0.6rem;
}
.error-recent-name {
  font-size: 0.92rem;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.error-recent-date {
  font-size: 0.78rem;
  color: var(--text-tertiary);
  flex-shrink: 0;
}
@media (max-width: 768px) {
  .error-page { padding: 2.5rem 1rem 3rem; }
  .error-recent { padding: 1.25rem; }
  .error-recent-name { font-size: 0.85rem; }
  .error-btn { min-height: 44px; }
}
</style>
