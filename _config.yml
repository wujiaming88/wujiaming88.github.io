---
# 站点配置
title: W.ai
description: W.ai · 独立 AI 产业研究周刊｜每周把全球 AI 产业读薄
lang: zh-CN
timezone: Asia/Shanghai # 与博客作者时区一致,避免UTC时差导致当日文章被当成future post而不生成
future: true # 允许生成发布日期晚于构建时刻的文章,根治"未来时间被Jekyll静默跳过导致404"(写完即发模式,无需定时占位)
url: "https://wujiaming88.github.io" # GitHub Pages默认域名
baseurl: "" # 如果博客不在根目录，设置为子目录路径

# 主题配置
theme: minima

# 极简明亮主题
minimal_style: true

# 文章阅读量统计 API（C1：Cloudflare Worker + KV）
# 部署好 Worker 后，把下面这行取消注释并填成你的 Worker 地址（不带末尾斜杠）。
# 留空/注释 = 阅读量功能关闭，徽章不显示，对站点零影响。
# pageview_api: "https://你的worker.子域.workers.dev"
pageview_api: "https://my-blog-worker.garming-wu.workers.dev"

# 分类和标签配置
permalink: /:year/:month/:day/:title.html

# 插件配置
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# 分页配置
paginate: 10
paginate_path: "/page/:num/"

# Markdown设置
markdown: kramdown

# Kramdown配置 - 禁用代码行号避免渲染问题
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    line_numbers: false
    line_number_anchors: false
    css_class: 'code-content'
    default_lang: javascript

# 默认值
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author: W.ai

# 排除文件
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
